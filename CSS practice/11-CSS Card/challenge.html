<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 - Card Design</title>
    <style>
        
        body {
            background-color: #eaeff1;
            font-family: Arial, sans-serif;
        }

       
        .card {
            background-color: white;
            width: 300px;
            padding: 12px;
            border-radius: 15px;
            margin: 50px auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
        }

      
        .card img {
            width: 100%;
            border-radius: 12px;
        }

      
        .tags {
            margin-top: 12px;
        }

        .tags span {
            border: 1px solid #ccc;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: gray;
            margin-right: 5px;
        }

       
        .content h2 {
            margin: 15px 0 8px 0;
            color: #222;
        }

        .content p {
            color: gray;
            font-size: 14px;
            line-height: 1.5;
        }

      
        button {
            background-color: #e0efff;
            color: #0077ff;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: bold;
            display: block;
            margin: 18px auto 15px auto;
            cursor: pointer;
        }

        button:hover {
            background-color: #c7e0ff;
        }
    </style>
</head>
<body>

    <div class="card">
        
        <img src="picography-sunflowers-field-sunset.jpg"Lake Image">

    
        <div class="tags">
            <span>Nature</span>
            <span>Lake</span>
        </div>

        <div class="content">
            <h2>Lago di Braies</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Consectetur sodales morbi dignissim sed diam.</p>
        </div>

        <button>Read More</button>
    </div>

</body>
</html>
