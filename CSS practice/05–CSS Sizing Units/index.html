<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sizing Units</title>
    <style>
        .box {
            background-color: maroon;
            /* margin: 5vh; */
            padding: 2rem;
            color: white;   
        }
        p {
            background-color: maroon;
            padding: 32px;
            color: white;
        }
        .box2 {
            background-color: thistle;
            /* padding: 2em; */
            border: 2px solid black;
            margin: 100vh;
        }
        #red{
            background-color: aqua;
            border: 4em solid rgb(134, 97, 97);
            margin: 50vw ;
        }
    </style>
</head>

<body>
    <div class="box">
        Hello my name is Amna Shahzad.
    </div>
    <p>
        I am a good girl.
    </p>
    <div class="box2">
        I am from Pakistan.
    </div>
    <div id="red">
        I have one dog.
    </div>

</body>

</html>
