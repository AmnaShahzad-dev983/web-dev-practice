<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        div {
            /* color key word */
            background-color: thistle;
        }
        p {
            /* hex color code  */
            background-color: #7D5AC4;
        }
        span {
            /* rgb  */
            background-color: rgb(85, 140, 99);
        }
        h1 {
            /* rgba  */
            background-color: rgba(33, 11, 22, 44);
            color: white;
        }
    </style>
</head>

<body>
    Colors in CSS
    <ol>
        <li>Color code</li>
        <li>hex color code</li>
        <li>rgb</li>
        <li>rgba</li>
        <li>hsl</li>
    </ol>
    <div>
        My name is Amna
    </div>
    <p>
        I am a good girl.
    </p>
    <span>
        I am from Pakistan.
    </span>
    <h1>
        He is Ali.
    </h1>
</body>

</html>
